[project]
name = "safety-under-disguise"
version = "0.1.0"
description = "Do encoded prompts (base64, ROT13, leetspeak, homoglyph, Hindi) bypass LLM safety guardrails across model sizes and families?"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models / network (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
